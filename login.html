<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- ================ PAGE TITLE ================ -->
  <title>Login - Savings Group Manager</title>

  <!-- ================ BANK HOUSE FAVICON - TEAL BACKGROUND ================ -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2326A69A'/><path d='M50 20 L20 45 L20 80 L80 80 L80 45 Z' fill='white'/><rect x='45' y='55' width='10' height='25' fill='%2326A69A'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%2326A69A'/><path d='M90 36 L36 81 L36 144 L144 144 L144 81 Z' fill='white'/><rect x='81' y='99' width='18' height='45' fill='%2326A69A'/></svg>">
  <meta name="msapplication-TileColor" content="#20B2AA">
  <meta name="theme-color" content="#20B2AA">

  <!-- ================ STYLESHEETS ================ -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    .auth-page {
      background: linear-gradient(135deg, #183768, #0e1f3a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 450px;
    }

    .auth-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.6s ease;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 30px;
    }

    /* RESTORED APP ICON WITH NEW WHITE HOUSE */
    .app-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #26A69A, #1E7E74);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .app-icon i {
      font-size: 40px;
      color: white;
    }

    .auth-card h1 {
      color: #183768;
      margin-bottom: 5px;
      font-size: 28px;
    }

    .auth-card h2 {
      color: #6c757d;
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #183768;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: #26A69A;
      outline: none;
      box-shadow: 0 0 0 3px rgba(38,166,154,0.1);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }

    .checkbox-group input {
      width: auto;
      margin: 0;
    }

    .checkbox-group label {
      margin: 0;
      font-weight: normal;
      color: #6c757d;
      cursor: pointer;
    }

    .forgot-link {
      display: block;
      text-align: right;
      color: #26A69A;
      text-decoration: none;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #26A69A, #1E7E74);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(38,166,154,0.3);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .btn-primary.loading .spinner {
      display: inline-block;
    }

    .btn-primary.loading .btn-text {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .setup-prompt {
      margin-top: 30px;
      padding: 25px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 2px dashed #183768;
      text-align: center;
    }

    .setup-prompt p {
      color: #183768;
      margin-bottom: 15px;
      font-weight: 600;
      font-size: 15px;
    }

    .btn-setup {
      display: inline-block;
      padding: 12px 30px;
      background: linear-gradient(135deg, #183768, #1e4282);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .btn-setup:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(24,55,104,0.3);
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .footer-note {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e9ecef;
      font-size: 12px;
      color: #6c757d;
    }

    .footer-note a {
      color: #26A69A;
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo-area">
        <div class="app-icon">
          <i class="fas fa-landmark"></i>
        </div>
        <h1>Savings Group Manager</h1>
        <h2>Login to your account</h2>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>

        <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot Password?</a>

        <button type="submit" id="loginBtn" class="btn-primary">
          <span class="spinner"></span>
          <span class="btn-text">Login</span>
        </button>
      </form>

      <div id="loginMessage" class="message"></div>

      <!-- First-time setup prompt - ONLY shown when no admin exists -->
      <div id="setupPrompt" class="setup-prompt" style="display: none;">
        <p>🚀 First time using Savings Group Manager?</p>
        <a href="setup.html" class="btn-setup">Create Admin Account</a>
      </div>

      <div class="footer-note">
        <span>Version 3.0.0</span> •
        <span>Created with <i class="fas fa-heart" style="color: #e91e63;"></i> by Tha for Savers</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Check for saved credentials
      const savedEmail = localStorage.getItem('saved_email');
      const savedPassword = localStorage.getItem('saved_password');
      if (savedEmail && savedPassword) {
        document.getElementById('email').value = savedEmail;
        document.getElementById('password').value = savedPassword;
        document.getElementById('rememberMe').checked = true;
      }

      // Check if any admin exists
      const users = StorageManager.getItem(StorageManager.KEYS.USERS) || [];
      const adminExists = users.some(u => u.role === 'admin');

      // Show setup prompt if no admin
      const setupPrompt = document.getElementById('setupPrompt');
      if (setupPrompt) {
        setupPrompt.style.display = adminExists ? 'none' : 'block';
      }

      // Handle forgot password
      document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
        e.preventDefault();
        alert('🔐 Forgot Password?\n\nPlease contact your group administrator to reset your password.\n\nIf you are the administrator, you can reset your password by clearing browser data and running setup again.');
      });

      // Handle login form submission
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('rememberMe').checked;
        const btn = document.getElementById('loginBtn');
        const msg = document.getElementById('loginMessage');

        // Clear previous messages
        msg.className = 'message';
        msg.textContent = '';

        // Show loading state
        btn.classList.add('loading');
        btn.disabled = true;

        // Simulate network delay
        setTimeout(() => {
          try {
            const user = StorageManager.authenticateUser(email, password);

            if (user) {
              // Save credentials if remember me is checked
              if (rememberMe) {
                localStorage.setItem('saved_email', email);
                localStorage.setItem('saved_password', password);
              } else {
                localStorage.removeItem('saved_email');
                localStorage.removeItem('saved_password');
              }

              // Remove password from session storage
              const { password, ...userWithoutPassword } = user;
              AuthManager.setCurrentUser(userWithoutPassword);

              // Redirect based on role
              if (user.role === 'admin') {
                window.location.href = 'admin.html';
              } else {
                window.location.href = 'member-portal.html';
              }
            } else {
              // Show error
              btn.classList.remove('loading');
              btn.disabled = false;

              msg.textContent = 'Invalid email or password';
              msg.className = 'message error-message';
            }
          } catch (error) {
            console.error('Login error:', error);
            btn.classList.remove('loading');
            btn.disabled = false;

            msg.textContent = 'An error occurred. Please try again.';
            msg.className = 'message error-message';
          }
        }, 800);
      });
    });
  </script>
</body>
</html>
