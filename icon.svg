<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Teal rounded square -->
  <rect width="512" height="512" rx="100" fill="#20B2AA"/>

  <!-- Bank Building Base -->
  <rect x="106" y="256" width="300" height="180" fill="#D3D3D3"/>

  <!-- Pediment with Dollar symbol -->
  <polygon points="256,96 96,256 416,256" fill="#C0C0C0"/>
  <circle cx="256" cy="160" r="30" fill="#E0E0E0"/>
  <text x="256" y="170" text-anchor="middle" font-size="28" font-weight="bold" fill="#800080">K</text>

  <!-- Columns - Four total -->
  <rect x="126" y="256" width="25" height="180" fill="#A9A9A9"/>
  <rect x="176" y="256" width="25" height="180" fill="#A9A9A9"/>
  <rect x="311" y="256" width="25" height="180" fill="#A9A9A9"/>
  <rect x="361" y="256" width="25" height="180" fill="#A9A9A9"/>

  <!-- Column capitals -->
  <rect x="126" y="226" width="25" height="30" fill="#BDBDBD"/>
  <rect x="176" y="226" width="25" height="30" fill="#BDBDBD"/>
  <rect x="311" y="226" width="25" height="30" fill="#BDBDBD"/>
  <rect x="361" y="226" width="25" height="30" fill="#BDBDBD"/>

  <!-- Doorway -->
  <rect x="236" y="336" width="40" height="100" fill="#4B0082"/>

  <!-- Golden door handle -->
  <circle cx="260" cy="386" r="5" fill="#FFD700"/>
</svg>